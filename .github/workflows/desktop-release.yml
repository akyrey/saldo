# Builds the desktop app (Tauri) for macOS, Windows and Linux and attaches the
# installers to a GitHub Release.
#
# - Push a `vX.Y.Z` tag: a draft release `Saldo X.Y.Z` is created once with
#   the `## [X.Y.Z]` section of CHANGELOG.md as its notes, every platform
#   uploads into it, and you publish it after a look.
# - Run it by hand (Actions > Desktop release > Run workflow): the same builds,
#   kept as workflow artifacts, no release.
#
# In-app updates: tag builds also make signed updater bundles (the key is in
# the secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD;
# the public half is in tauri.conf.json), and a last job writes `latest.json`,
# which installed apps read once the release is published.
#
# No Apple Developer ID or Windows certificate. The macOS app is signed with a
# self-signed certificate (secrets APPLE_CERTIFICATE and
# APPLE_CERTIFICATE_PASSWORD, made by desktop/scripts/make-macos-signing-cert.sh)
# so every release has the same identity and keeps its keychain access after
# an update; without the secrets it falls back to ad-hoc (tauri.conf.json
# signingIdentity "-"). Apple Silicon needs one of the two, or macOS calls the
# app "damaged". Neither is notarized, so macOS still asks once to allow it in
# System Settings, and Windows SmartScreen asks for "Run anyway".
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft for all platforms. Letting each build create it races, and
  # GitHub cannot look a draft up by tag, so parallel jobs would make several.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      # The release notes are the tag's section of CHANGELOG.md, without its
      # heading (the release title has the version). No section, no release:
      # move [Unreleased] under the new version before tagging.
      - name: Changelog section for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version]" '
            /^## \[/ { inside = index($0, heading) == 1; next }
            inside
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no entries under ## [$version]"
            exit 1
          fi
          cat notes.md
      - id: release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const version = context.ref.replace("refs/tags/v", "");
            const changes = fs.readFileSync("notes.md", "utf8").trim();
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${version}`,
              name: `Saldo ${version}`,
              draft: true,
              body: [
                changes,
                "",
                "## Install",
                "",
                "Desktop app for Saldo. Download the file for your system:",
                "",
                "- **macOS**: `.dmg` (`aarch64` for Apple Silicon, `x64` for Intel). Not notarized: the first time macOS blocks it, open System Settings > Privacy & Security and click Open Anyway (or run `xattr -dr com.apple.quarantine /Applications/Saldo.app`).",
                "- **Windows**: `.msi` or `-setup.exe`. Unsigned: SmartScreen > More info > Run anyway.",
                "- **Linux**: `.AppImage`, `.deb` or `.rpm`.",
                "",
                "The server needs `SALDO_ALLOWED_ORIGINS=tauri://localhost,http://tauri.localhost`.",
                "The server image for this version is on Docker Hub with the same tag.",
              ].join("\n"),
            });
            return data.id;

  build:
    needs: create-release
    # Runs for tags (after the draft exists) and for manual runs (no release).
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            args: --target aarch64-apple-darwin
            name: macos-arm64
          - runner: macos-latest
            args: --target x86_64-apple-darwin
            name: macos-x64
          - runner: ubuntu-22.04
            args: ""
            name: linux-x64
          - runner: windows-latest
            args: ""
            name: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.runner == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}
      - name: Linux libraries (web view, tray, keychain over D-Bus)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - name: App version from the tag, with updater bundles
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const file = "desktop/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            // Needs the signing key, so only releases make them, not CI or local builds.
            config.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
            console.log("version", config.version);
          '
      # Tauri only accepts certificates macOS trusts when it imports one
      # itself (APPLE_CERTIFICATE), so the step imports it into its own
      # keychain and hands Tauri just the identity name.
      - name: macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$APPLE_CERTIFICATE" ]]; then
            echo "No APPLE_CERTIFICATE secret: the app is signed ad-hoc"
            exit 0
          fi
          keychain="$RUNNER_TEMP/saldo-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          certificate="$RUNNER_TEMP/saldo-signing.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          rm "$certificate"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # The common name set by make-macos-signing-cert.sh.
          identity="Saldo Self-Signed"
          security find-identity -p codesigning "$keychain" | grep -q "\"$identity\"" \
            || { echo "::error::$identity not found in APPLE_CERTIFICATE"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.id }}
          # Each job would read, extend and rewrite latest.json at the same
          # time and lose platforms; the updater-json job writes it once.
          includeUpdaterJson: false
          # Manual runs: keep the installers as workflow artifacts instead.
          uploadWorkflowArtifacts: ${{ needs.create-release.result == 'skipped' }}
          workflowArtifactNamePattern: saldo-desktop-${{ matrix.name }}-[bundle]

  # Writes latest.json from the signatures the builds uploaded. The app asks
  # .../releases/latest/download/latest.json, which skips drafts, so updates
  # reach people only after the release is published.
  updater-json:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const tag = context.ref.replace("refs/tags/", "");
            // Signature file suffix -> updater targets ({os}-{arch}[-{installer}]).
            // The first target of a rule is also the plain {os}-{arch} entry.
            const rules = [
              { suffix: ".app.tar.gz.sig", os: "darwin", installer: "app", primary: true },
              { suffix: "-setup.exe.sig", os: "windows", installer: "nsis", primary: true },
              { suffix: ".msi.sig", os: "windows", installer: "msi" },
              { suffix: ".AppImage.sig", os: "linux", installer: "appimage", primary: true },
              { suffix: ".deb.sig", os: "linux", installer: "deb" },
              { suffix: ".rpm.sig", os: "linux", installer: "rpm" },
            ];
            const required = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64", "linux-x86_64"];

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            });
            const names = new Set(assets.map((a) => a.name));
            const platforms = {};
            for (const asset of assets) {
              const rule = rules.find((r) => asset.name.endsWith(r.suffix));
              if (!rule) continue;
              const bundle = asset.name.slice(0, -".sig".length);
              if (!names.has(bundle)) throw new Error(`${asset.name} has no ${bundle}`);
              const { data } = await github.request("GET /repos/{owner}/{repo}/releases/assets/{asset_id}", {
                owner, repo, asset_id: asset.id, headers: { accept: "application/octet-stream" },
              });
              const entry = {
                signature: Buffer.from(data).toString("utf8"),
                url: `https://github.com/${owner}/${repo}/releases/download/${tag}/${encodeURIComponent(bundle)}`,
              };
              // Only macOS has two architectures; the other builds are x86_64.
              const arch = rule.os === "darwin" && asset.name.includes("aarch64") ? "aarch64" : "x86_64";
              platforms[`${rule.os}-${arch}-${rule.installer}`] = entry;
              if (rule.primary) platforms[`${rule.os}-${arch}`] = entry;
            }
            const missing = required.filter((target) => !platforms[target]);
            if (missing.length > 0) throw new Error(`no updater bundle for ${missing.join(", ")}`);

            const manifest = {
              version: tag.replace(/^v/, ""),
              notes: `https://github.com/${owner}/${repo}/releases/tag/${tag}`,
              pub_date: new Date().toISOString(),
              platforms,
            };
            const old = assets.find((a) => a.name === "latest.json");
            if (old) await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: "latest.json",
              data: JSON.stringify(manifest, null, 2),
              headers: { "content-type": "application/json" },
            });
            core.info(`latest.json: ${Object.keys(platforms).sort().join(", ")}`);
