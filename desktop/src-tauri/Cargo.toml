# The Saldo desktop app: a Tauri 2 shell around the web app in web/.
# Not a member of the main workspace (see the root Cargo.toml).
[package]
name = "saldo-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
# Tauri builds the app code as a library; main.rs only calls `run()`.
name = "saldo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-window-state = "2.5.0"
# The OS keychain: macOS Keychain, Windows Credential Manager, Linux Secret Service.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
