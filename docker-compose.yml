services:
  saldo:
    build: .
    image: saldo:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SALDO_PUBLIC_URL: ${SALDO_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - saldo-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  saldo-data:
