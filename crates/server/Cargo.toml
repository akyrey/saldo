[package]
name = "saldo-server"
description = "Saldo HTTP API server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "saldo"
path = "src/main.rs"

[dependencies]
axum.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
clap.workspace = true
futures-util.workspace = true
rust-embed = { version = "8.14", features = ["mime-guess", "include-exclude", "debug-embed"], optional = true }
saldo-app.workspace = true
saldo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa = { workspace = true, features = ["chrono", "uuid"] }
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
sqlx.workspace = true
http-body-util.workspace = true
tower.workspace = true
uuid = { workspace = true, features = ["v4"] }

[lints]
workspace = true

[features]
# Serve the built web app (web/dist, from `npm run build`) from the binary.
# Like a Go build tag: `cargo build --features embed-web`.
embed-web = ["dep:rust-embed"]
