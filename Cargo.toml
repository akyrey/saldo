# The workspace root: like a Composer monorepo root or a Go `go.work` file.
# All crates share one Cargo.lock and one target/ directory.
[workspace]
resolver = "3"
members = ["crates/*"]

# Fields every crate inherits with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Shared dependency versions; crates opt in with `dep.workspace = true`.
[workspace.dependencies]
saldo-core = { path = "crates/core" }
saldo-app = { path = "crates/app" }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["serde"] }
proptest = "1.12.0"
argon2 = "0.6.0"
rand = "0.10.3"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1.44"
utoipa = "6.0.0"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
tower = { version = "0.5.3", features = ["util"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa-axum = "0.3.0"
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls", "http2"] }
wiremock = "0.6.5"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Argon2 is deliberately slow; unoptimised it makes every login test crawl.
# Compile only the hashing crates with optimisations in dev and test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
